# Minimal fine-tuning (Level 1)
# 기존 가중치 최대 보존, 헤드만 미세조정
# freeze: 75 (backbone 대부분 고정)
# epochs: 200 (controlled in 03_finetune.py)

lr0: 0.0001
lrf: 0.1
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5.0
warmup_momentum: 0.8
warmup_bias_lr: 0.01

box: 0.05
cls: 0.3
cls_pw: 1.0
obj: 0.7
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

hsv_h: 0.015
hsv_s: 0.5
hsv_v: 0.3
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.05
copy_paste: 0.0
paste_in: 0.0
loss_ota: 1
